[package]
name = "monica-rust-desktop"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
name = "monica_rust_desktop"
path = "src/lib.rs"

[[bin]]
name = "monica-rust-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
custom-protocol = ["tauri/custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-autostart", "dep:tauri-plugin-single-instance", "dep:signal-hook"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "0.9"
fs2 = "0.4"
libc = "0.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v5"] }
signal-hook = { version = "0.3", optional = true }
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
