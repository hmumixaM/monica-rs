name: Rust validation
on: [push, pull_request]
concurrency:
  group: rust-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # PostgreSQL 16 packages are part of the Ubuntu 24.04 test contract.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Enable logical WAL for isolated CDC regression
        run: |
          psql "$DATABASE_URL" -c "ALTER SYSTEM SET wal_level = logical"
          psql "$DATABASE_URL" -c "ALTER SYSTEM SET max_replication_slots = 30"
          docker restart ${{ job.services.postgres.id }}
          for attempt in $(seq 1 30); do pg_isready -h localhost -U postgres && break; sleep 1; done
      - run: cargo test --workspace --locked
      - name: HTTP authentication regression
        env:
          MONICA_DATABASE_URL: postgres://postgres:synthetic-ci-only@localhost/monica_http_test
        run: |
          cargo build --locked -p monica-server
          psql "$DATABASE_URL" -c 'CREATE DATABASE monica_http_test'
          target/debug/monica-server migrate
          python3 scripts/smoke-http.py
          python3 scripts/test-media-helper.py
      - name: Offline legacy migration contract
        env:
          MONICA_PG_BIN: /usr/lib/postgresql/16/bin
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-16
          python3 -m venv "$RUNNER_TEMP/legacy-migration"
          "$RUNNER_TEMP/legacy-migration/bin/pip" install 'psycopg[binary]==3.2.12' cryptography==46.0.3
          "$RUNNER_TEMP/legacy-migration/bin/python" scripts/test-legacy-import.py
          MONICA_GROUP_IMAGE_TEST_ADMIN="$DATABASE_URL" "$RUNNER_TEMP/legacy-migration/bin/python" scripts/test-wechat-group-images.py
          python3 scripts/test-migration-file-copy.py
          python3 scripts/test-nas-migration-copy.py
          python3 scripts/test-nas-migration-download.py
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: npm ci && npm run build && npx playwright install --with-deps chrome webkit
        working-directory: apps/web
      - run: npm test -- tests/router.spec.ts tests/ask-runtime.spec.ts tests/auth-errors.spec.ts tests/home-read-failures.spec.ts tests/feed-media-mobile.spec.ts
        working-directory: apps/web
      - name: Mobile WebKit media layouts
        run: npm test -- tests/feed-media-mobile.spec.ts
        working-directory: apps/web
        env:
          MONICA_WEB_TEST_BROWSER: webkit
      - run: cargo build --locked -p monica-server
      - run: python3 scripts/frontend-smoke.py
        env:
          MONICA_PG_BIN: /usr/lib/postgresql/16/bin
      - name: Populated Rust pages and MCP UI
        run: python3 scripts/frontend-pages-smoke.py
        env:
          MONICA_PG_BIN: /usr/lib/postgresql/16/bin
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: .local-validation/
  adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/whatsapp/go.mod
          cache-dependency-path: |
            services/whatsapp/go.sum
            tools/migration-media/go.sum
      - run: python3 scripts/test-collector-bridge.py && python3 scripts/test-collector-chatlog.py
      - run: python3 scripts/test-build-context.py
      - run: python3 scripts/test-collector-supervisor.py
      - run: python3 scripts/test-retry-wechat-media.py
      - run: python3 -m pip install uv==0.9.17
      - name: Benchmark availability and latency reporting
        run: uv run --no-project --python 3.12 --with psutil==7.1.3 python scripts/test-benchmark-read-results.py
      - name: Collector publication and messages against locked dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/monica-collector-tests
        run: uv run --project apps/desktop/collectors --frozen python -m pytest apps/desktop/collectors/tests
      - run: go test ./...
        working-directory: services/whatsapp
      - name: Migration media preservation and codec contracts
        run: go test -mod=readonly ./...
        working-directory: tools/migration-media
        env:
          CGO_ENABLED: '1'
  optional-containers:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and check the optional WhatsApp image
        run: |
          docker buildx build --load --platform ${{ matrix.platform }} -t monica-whatsapp:test -f infra/whatsapp.Dockerfile .
          docker run --rm --platform ${{ matrix.platform }} --network none --entrypoint /usr/local/bin/monica-whatsapp monica-whatsapp:test --help
      - name: Build and check the optional browser collector image
        run: |
          docker buildx build --load --platform ${{ matrix.platform }} -t monica-collectors:test -f infra/collectors.Dockerfile .
          docker run --rm --platform ${{ matrix.platform }} --network none monica-collectors:test --help
          docker run --rm --platform ${{ matrix.platform }} --network none --memory 768m --shm-size 256m --entrypoint /opt/monica/collectors/.venv/bin/python monica-collectors:test -I -c '
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-background-networking"])
              try:
                  page = browser.new_context(offline=True).new_page()
                  page.set_content("<title>Monica synthetic collector</title><main>Only synthetic data</main>")
                  assert page.title() == "Monica synthetic collector"
                  assert page.locator("main").inner_text() == "Only synthetic data"
                  print("Offline container Chromium passed:", browser.version)
              finally:
                  browser.close()
          '
  native:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      # Source checks use explicit runtime inputs in the lifecycle test below.
      # The separately verified app bundle includes its complete real runtime.
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: brew install postgresql@16
      - run: npm ci && npm run build
        working-directory: apps/web
      - run: npm ci && npm run build && npx playwright install chrome && npm test
        working-directory: apps/native-desktop
      - run: cargo clippy --manifest-path apps/native-desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path apps/native-desktop/src-tauri/Cargo.toml --locked
      - run: python3 apps/native-desktop/tests/test_native_messages.py
      - run: cargo build --locked -p monica-server
      - name: Native lifecycle against disposable database
        run: |
          export MONICA_NATIVE_SERVER="$PWD/target/debug/monica-server"
          export MONICA_NATIVE_PG_BIN="$(brew --prefix postgresql@16)/bin"
          export MONICA_NATIVE_WEB="$PWD/apps/web/dist"
          cargo test --manifest-path apps/native-desktop/src-tauri/Cargo.toml --locked --test native_runtime -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-failure-evidence
          path: .local-validation/
