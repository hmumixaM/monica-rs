name: Isolated container artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Identify test artifact
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}:test-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "whatsapp=ghcr.io/${GITHUB_REPOSITORY,,}-whatsapp:test-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "collectors=ghcr.io/${GITHUB_REPOSITORY,,}-collectors:test-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Build optional WhatsApp adapter
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/whatsapp.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.whatsapp }}
          cache-from: type=gha,scope=whatsapp
          cache-to: type=gha,scope=whatsapp,mode=max
          provenance: true
          sbom: true
      - name: Build optional browser collectors
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/collectors.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.collectors }}
          cache-from: type=gha,scope=collectors
          cache-to: type=gha,scope=collectors,mode=max
          provenance: true
          sbom: true
      - name: Validate offline adapter entry points
        env:
          WHATSAPP_IMAGE: ${{ steps.image.outputs.whatsapp }}
          COLLECTORS_IMAGE: ${{ steps.image.outputs.collectors }}
        run: |
          docker run --rm --entrypoint /usr/local/bin/monica-whatsapp "$WHATSAPP_IMAGE" --help
          docker run --rm "$COLLECTORS_IMAGE" --help
          docker buildx imagetools inspect "$WHATSAPP_IMAGE" > whatsapp-manifest.txt
          docker buildx imagetools inspect "$COLLECTORS_IMAGE" > collectors-manifest.txt
      - name: Run empty-database container acceptance
        env:
          MONICA_IMAGE: ${{ steps.image.outputs.name }}
          MONICA_TEST_DB_PASSWORD: synthetic-artifact-only
          MONICA_SESSION_SECRET: synthetic-artifact-session-secret-32bytes
        run: |
          docker compose -f infra/compose.yaml up --no-build --wait --wait-timeout 180 server
          curl --fail http://127.0.0.1:17494/api/v1/ready
          curl --fail http://127.0.0.1:17494/profiles
          python3 scripts/smoke-auth.py http://127.0.0.1:17494
          docker buildx imagetools inspect "$MONICA_IMAGE" > container-manifest.txt
      - name: Collect container diagnostics
        if: always()
        run: docker compose -f infra/compose.yaml logs --no-color > container-logs.txt
        env:
          MONICA_TEST_DB_PASSWORD: synthetic-artifact-only
          MONICA_SESSION_SECRET: synthetic-artifact-session-secret-32bytes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-evidence
          path: |
            container-manifest.txt
            container-logs.txt
            whatsapp-manifest.txt
            collectors-manifest.txt
      - name: Remove isolated test volumes
        if: always()
        env:
          MONICA_TEST_DB_PASSWORD: synthetic-artifact-only
          MONICA_SESSION_SECRET: synthetic-artifact-session-secret-32bytes
        run: docker compose -f infra/compose.yaml down --volumes
