name: monica-rs-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: monica_rust_test
      POSTGRES_USER: monica
      POSTGRES_PASSWORD: ${MONICA_TEST_DB_PASSWORD:?Set a password for this isolated test instance}
    volumes:
      - test-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U monica -d monica_rust_test']
      interval: 5s
      retries: 12
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    image: monica-rs:local
    command: [migrate]
    environment: &runtime
      MONICA_DATABASE_URL: postgresql://monica:${MONICA_TEST_DB_PASSWORD}@postgres/monica_rust_test
      MONICA_SESSION_SECRET: ${MONICA_SESSION_SECRET:?Set an isolated random secret of at least 32 bytes}
      MONICA_ORIGIN: http://127.0.0.1:17494
      MONICA_MEDIA_ROOT: /data/media
    depends_on:
      postgres:
        condition: service_healthy
  server:
    image: monica-rs:local
    environment: *runtime
    ports: ['127.0.0.1:17494:17494']
    volumes:
      - test-media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  test-postgres:
  test-media:
