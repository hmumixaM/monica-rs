name: monica-rs
services:
  postgres:
    image: ${MONICA_POSTGRES_IMAGE:?Set an immutable PostgreSQL 16 image}
    environment:
      POSTGRES_DB: monica_rust
      POSTGRES_USER: monica_rust
      POSTGRES_PASSWORD: ${MONICA_DB_PASSWORD:?Set an independent database password}
    command: [postgres, -c, shared_buffers=64MB, -c, work_mem=4MB, -c, maintenance_work_mem=32MB, -c, max_connections=30, -c, max_parallel_workers_per_gather=0]
    volumes:
      - ${MONICA_RUST_DATA_ROOT:?Set an independent Rust data root}/postgres:/var/lib/postgresql/data
    networks: [isolated]
    mem_limit: 384m
    cpuset: '${MONICA_CPUSET:-3}'
    cpu_shares: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U monica_rust -d monica_rust']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  server:
    image: ${MONICA_IMAGE:?Set the reviewed Rust image digest}
    group_add: ['10001']
    environment:
      MONICA_DATABASE_URL: postgresql://monica_rust:${MONICA_DB_PASSWORD}@postgres/monica_rust
      MONICA_SESSION_SECRET: ${MONICA_SESSION_SECRET:?Set a new installation secret}
      MONICA_CONTROL_TOKEN: ${MONICA_CONTROL_TOKEN:?Set an independent control token}
      MONICA_IMPORT_HMAC_SECRET: ${MONICA_IMPORT_HMAC_SECRET:?Set an independent import key}
      MONICA_COOKIE_PREFIX: monica_rs
      MONICA_ORIGIN: https://nas.tailfb022c.ts.net:9444
      MONICA_MEDIA_ROOT: /data/media
      MONICA_LEGACY_ARCHIVE_ROOT: /data/archive
      MONICA_LEGACY_MIGRATION_ROOT: /data/migration
      MONICA_AI_EXECUTION_ENABLED: 'false'
      MONICA_AI_QA_ENABLED: 'false'
      MONICA_OCR_ENABLED: 'false'
      MONICA_START_PAUSED: ${MONICA_START_PAUSED:-true}
      TOKIO_WORKER_THREADS: '2'
    volumes:
      - ${MONICA_RUST_DATA_ROOT}/media:/data/media
      - ${MONICA_RUST_DATA_ROOT}/snapshots/monica-next:/data/archive:ro
      - ${MONICA_RUST_DATA_ROOT}/migration:/data/migration:ro
    networks: [isolated]
    mem_limit: 384m
    cpuset: '${MONICA_CPUSET:-3}'
    cpu_shares: 128
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', http://127.0.0.1:17494/api/v1/ready]
      interval: 30s
      timeout: 6s
      retries: 20
      start_period: 120s
    logging: *logging
  proxy:
    image: ${MONICA_PROXY_IMAGE:?Set an immutable Caddy image}
    ports:
      - '${MONICA_BIND_ADDRESS:-100.77.236.1}:9444:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ${MONICA_RUST_DATA_ROOT}/proxy-data:/data
      - ${MONICA_RUST_DATA_ROOT}/proxy-config:/config
    networks: [isolated]
    mem_limit: 64m
    cpuset: '${MONICA_CPUSET:-3}'
    cpu_shares: 64
    restart: unless-stopped
    depends_on:
      server: {condition: service_healthy}
    logging: *logging
networks:
  isolated:
    internal: true
