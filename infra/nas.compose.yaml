name: monica-rs
services:
  postgres:
    image: ${MONICA_POSTGRES_IMAGE:?Set an immutable PostgreSQL 16 image}
    environment:
      POSTGRES_DB: monica_rust
      POSTGRES_USER: monica_rust
      POSTGRES_PASSWORD: ${MONICA_DB_PASSWORD:?Set an independent database password}
    # The database is several times larger than memory. Keep its hot pages in
    # shared buffers, price storage as the SSD it is, and log slow statements
    # without their bound values.
    command:
      - postgres
      - -c
      - shared_buffers=${MONICA_PG_SHARED_BUFFERS:-1GB}
      # Reload the previously cached pages after a restart instead of reading
      # them back one request at a time.
      - -c
      - shared_preload_libraries=pg_prewarm
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=40
      - -c
      - max_parallel_workers=2
      - -c
      - random_page_cost=1.1
      - -c
      - jit=off
      - -c
      - wal_buffers=16MB
      - -c
      - wal_compression=lz4
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=2GB
      - -c
      - track_io_timing=on
      - -c
      - log_min_duration_statement=2s
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    volumes:
      # Never create a missing directory: everything lives on an external disk,
      # and a container that starts before the disk is mounted must fail instead
      # of initializing an empty database or writing media to the system disk.
      - type: bind
        source: ${MONICA_RUST_DATA_ROOT:?Set an independent Rust data root}/postgres
        target: /var/lib/postgresql/data
        bind: &existing {create_host_path: false}
      # Import workers reach the database through this socket directory. It is a
      # host directory so that replacing this container does not disconnect them.
      - type: bind
        source: ${MONICA_RUST_DATA_ROOT}/postgres-run
        target: /var/run/postgresql
        bind: *existing
    networks: [isolated]
    shm_size: 256m
    mem_limit: ${MONICA_PG_MEMORY:-3g}
    stop_grace_period: 120s
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U monica_rust -d monica_rust']
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  migrate:
    profiles: [migrate]
    image: ${MONICA_IMAGE:?Set the reviewed Rust image digest}
    command: [migrate]
    environment:
      MONICA_DATABASE_URL: postgresql://monica_rust:${MONICA_DB_PASSWORD}@postgres/monica_rust
      MONICA_MIGRATION_STATEMENT_TIMEOUT_SECONDS: ${MONICA_MIGRATION_STATEMENT_TIMEOUT_SECONDS:-3600}
    networks: [isolated]
    depends_on:
      postgres: {condition: service_healthy}
    logging: *logging
  server:
    group_add: ['10001']
    image: ${MONICA_IMAGE:?Set the reviewed Rust image digest}
    environment:
      MONICA_DATABASE_URL: postgresql://monica_rust:${MONICA_DB_PASSWORD}@postgres/monica_rust
      MONICA_SESSION_SECRET: ${MONICA_SESSION_SECRET:?Set a new installation secret}
      MONICA_CONTROL_TOKEN: ${MONICA_CONTROL_TOKEN:?Set an independent control token}
      MONICA_IMPORT_HMAC_SECRET: ${MONICA_IMPORT_HMAC_SECRET:?Set an independent import key}
      MONICA_COOKIE_PREFIX: monica_rs
      MONICA_ORIGIN: https://nas.tailfb022c.ts.net:9444
      MONICA_MEDIA_ROOT: /data/media
      MONICA_LEGACY_ARCHIVE_ROOT: /data/archive
      MONICA_LEGACY_MIGRATION_ROOT: /data/migration
      MONICA_AI_EXECUTION_ENABLED: ${MONICA_AI_EXECUTION_ENABLED:-false}
      MONICA_AI_QA_ENABLED: ${MONICA_AI_QA_ENABLED:-false}
      MONICA_OCR_ENABLED: ${MONICA_OCR_ENABLED:-false}
      MONICA_START_PAUSED: ${MONICA_START_PAUSED:-true}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - {type: bind, source: '${MONICA_RUST_DATA_ROOT}/media', target: /data/media, bind: *existing}
      - {type: bind, source: '${MONICA_RUST_DATA_ROOT}/snapshots/monica-next', target: /data/archive, read_only: true, bind: *existing}
      - {type: bind, source: '${MONICA_RUST_DATA_ROOT}/migration', target: /data/migration, read_only: true, bind: *existing}
    networks: [isolated, ingress]
    mem_limit: 1g
    stop_grace_period: 120s
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', http://127.0.0.1:17494/api/v1/ready]
      interval: 30s
      timeout: 6s
      retries: 20
      start_period: 120s
    logging: *logging
  proxy:
    image: ${MONICA_PROXY_IMAGE:?Set an immutable Caddy image}
    ports:
      - '${MONICA_BIND_ADDRESS:-100.77.236.1}:9444:443'
    volumes:
      - {type: bind, source: ./Caddyfile, target: /etc/caddy/Caddyfile, read_only: true, bind: *existing}
      - {type: bind, source: ./certs, target: /certs, read_only: true, bind: *existing}
      - {type: bind, source: '${MONICA_RUST_DATA_ROOT}/proxy-data', target: /data, bind: *existing}
      - {type: bind, source: '${MONICA_RUST_DATA_ROOT}/proxy-config', target: /config, bind: *existing}
    # Docker does not publish host ports for an exclusively internal bridge.
    # Only the TLS proxy joins this second, project-owned ingress network.
    networks: [isolated, ingress]
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      server: {condition: service_healthy}
    logging: *logging
networks:
  isolated:
    internal: true
  ingress: {}
